name: Build desktop apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build application and installer
        shell: powershell
        run: ./build.ps1 -RequireInstaller
      - name: Run rendering and storage regressions
        shell: powershell
        run: ./tests/run.ps1 -SkipScreenCapture
      - name: Package Windows release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          $output = "dist/$version"
          $installer = "$output/夹心贴-安装程序-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw 'Installer is missing.' }
          $files = @("$output/夹心贴.exe", "$output/使用说明.md", $installer)
          Compress-Archive -LiteralPath $files -DestinationPath "dist/JiaXinTie-Windows-x64-v$version.zip" -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: dist/JiaXinTie-Windows-x64-v*.zip
          if-no-files-found: error
          retention-days: 14
  macos:
    name: macOS Universal
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run core regressions
        run: swift run --package-path macos JiaXinTieRegression
      - name: Build Apple Silicon and Intel app
        run: ./build-macos.sh --universal
      - name: Run native window regressions and verify signature
        run: |
          dist/macOS/夹心贴.app/Contents/MacOS/JiaXinTie --smoke-test
          codesign --verify --deep --strict dist/macOS/夹心贴.app
          lipo -verify_arch arm64 x86_64 dist/macOS/夹心贴.app/Contents/MacOS/JiaXinTie
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: dist/macOS/JiaXinTie-macOS-universal-v*.zip
          if-no-files-found: error
          retention-days: 14
